[package]
name = "git-outpost"
version = "0.7.0"
description = "Manage parallel Git checkouts using local clones for editor and devcontainer workflows."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[[bin]]
name = "git-outpost"
path = "src/main.rs"

[[bin]]
name = "gop"
path = "src/main.rs"

[dependencies]
clap.workspace = true
clap_complete.workspace = true
outpost-core = { path = "../core", version = "0.7.0" }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
same-file = "1"

[dev-dependencies]
outpost-core = { path = "../core", features = ["test-helpers"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "^0.2.182"
